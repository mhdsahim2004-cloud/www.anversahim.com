<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgVisa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1526"/>
      <stop offset="100%" stop-color="#150F1C"/>
    </linearGradient>
    <linearGradient id="accentVisa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5CA8"/>
      <stop offset="100%" stop-color="#FF9F5C"/>
    </linearGradient>
    <linearGradient id="passportVisa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2440"/>
      <stop offset="100%" stop-color="#2A1B32"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgVisa)"/>

  <!-- top browser bar -->
  <rect x="0" y="0" width="800" height="42" fill="#241830"/>
  <circle cx="24" cy="21" r="6" fill="#FF5C5C" opacity="0.7"/>
  <circle cx="46" cy="21" r="6" fill="#FFC24C" opacity="0.7"/>
  <circle cx="68" cy="21" r="6" fill="#3FD69A" opacity="0.7"/>
  <rect x="290" y="12" width="220" height="18" rx="9" fill="#150F1C"/>

  <!-- hero text -->
  <rect x="70" y="80" width="330" height="22" rx="6" fill="#F1E9F4" opacity="0.92"/>
  <rect x="70" y="112" width="260" height="12" rx="5" fill="#B79EC2"/>
  <rect x="70" y="132" width="220" height="12" rx="5" fill="#B79EC2" opacity="0.7"/>
  <rect x="70" y="164" width="150" height="36" rx="9" fill="url(#accentVisa)"/>
  <rect x="232" y="164" width="130" height="36" rx="9" fill="none" stroke="#4A3454" stroke-width="2"/>

  <!-- trust badges -->
  <g fill="#B79EC2" font-size="0" >
    <circle cx="90" cy="240" r="7" fill="#3FD69A"/>
    <rect x="106" y="234" width="120" height="10" rx="4" fill="#8D96AC"/>
    <circle cx="90" cy="266" r="7" fill="#3FD69A"/>
    <rect x="106" y="260" width="150" height="10" rx="4" fill="#8D96AC"/>
    <circle cx="90" cy="292" r="7" fill="#3FD69A"/>
    <rect x="106" y="286" width="100" height="10" rx="4" fill="#8D96AC"/>
  </g>

  <!-- passport / document illustration -->
  <g>
    <rect x="470" y="70" width="230" height="300" rx="16" fill="url(#passportVisa)" stroke="#4A3454" stroke-width="2"/>
    <circle cx="585" cy="170" r="44" fill="none" stroke="url(#accentVisa)" stroke-width="4"/>
    <circle cx="585" cy="170" r="20" fill="url(#accentVisa)" opacity="0.7"/>
    <rect x="510" y="240" width="150" height="10" rx="4" fill="#8D96AC"/>
    <rect x="510" y="260" width="110" height="10" rx="4" fill="#8D96AC" opacity="0.7"/>
    <rect x="510" y="290" width="150" height="34" rx="7" fill="#1E1526" stroke="#4A3454"/>
    <rect x="524" y="300" width="90" height="8" rx="3" fill="#6E5878"/>
    <rect x="510" y="334" width="150" height="18" rx="5" fill="url(#accentVisa)" opacity="0.85"/>
  </g>

  <!-- stamp accent -->
  <g transform="translate(430,330) rotate(-18)">
    <circle r="34" fill="none" stroke="#FF9F5C" stroke-width="3" opacity="0.85"/>
    <circle r="24" fill="none" stroke="#FF9F5C" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- process steps -->
  <g>
    <rect x="70" y="352" width="130" height="60" rx="10" fill="#241830" stroke="#4A3454"/>
    <rect x="86" y="368" width="20" height="20" rx="5" fill="url(#accentVisa)"/>
    <rect x="116" y="372" width="70" height="10" rx="4" fill="#8D96AC"/>
    <rect x="216" y="352" width="130" height="60" rx="10" fill="#241830" stroke="#4A3454"/>
    <rect x="232" y="368" width="20" height="20" rx="5" fill="url(#accentVisa)"/>
    <rect x="262" y="372" width="70" height="10" rx="4" fill="#8D96AC"/>
  </g>
</svg>
