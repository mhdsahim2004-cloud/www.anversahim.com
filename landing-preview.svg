<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2E"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="accentLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="100%" stop-color="#35D6D6"/>
    </linearGradient>
    <radialGradient id="glowLand" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgLand)"/>
  <rect width="800" height="450" fill="url(#glowLand)"/>

  <!-- top browser bar -->
  <rect x="0" y="0" width="800" height="42" fill="#101E33"/>
  <circle cx="24" cy="21" r="6" fill="#FF5C5C" opacity="0.7"/>
  <circle cx="46" cy="21" r="6" fill="#FFC24C" opacity="0.7"/>
  <circle cx="68" cy="21" r="6" fill="#3FD69A" opacity="0.7"/>
  <rect x="310" y="12" width="180" height="18" rx="9" fill="#0A1420"/>

  <!-- nav -->
  <circle cx="60" cy="80" r="12" fill="url(#accentLand)"/>
  <rect x="82" y="74" width="70" height="12" rx="5" fill="#E9ECF4" opacity="0.85"/>
  <g fill="#8D96AC">
    <rect x="480" y="76" width="50" height="8" rx="4"/>
    <rect x="550" y="76" width="50" height="8" rx="4"/>
    <rect x="620" y="76" width="50" height="8" rx="4"/>
  </g>
  <rect x="690" y="66" width="90" height="30" rx="15" fill="url(#accentLand)"/>

  <!-- hero -->
  <rect x="200" y="140" width="400" height="26" rx="7" fill="#F1F4FA"/>
  <rect x="260" y="176" width="280" height="14" rx="6" fill="#8D96AC"/>
  <rect x="300" y="196" width="200" height="14" rx="6" fill="#8D96AC" opacity="0.7"/>

  <!-- big CTA button with glow -->
  <ellipse cx="400" cy="248" rx="110" ry="30" fill="#35D6D6" opacity="0.25"/>
  <rect x="300" y="230" width="200" height="46" rx="23" fill="url(#accentLand)"/>
  <rect x="335" y="248" width="130" height="10" rx="5" fill="#0A1420" opacity="0.85"/>

  <rect x="330" y="288" width="140" height="10" rx="5" fill="#5C6478"/>

  <!-- feature cards -->
  <g>
    <rect x="120" y="330" width="170" height="90" rx="12" fill="#101E33" stroke="#22304A"/>
    <circle cx="150" cy="358" r="12" fill="url(#accentLand)" opacity="0.85"/>
    <rect x="140" y="382" width="120" height="8" rx="4" fill="#8D96AC"/>
    <rect x="140" y="398" width="90" height="8" rx="4" fill="#5C6478"/>

    <rect x="315" y="330" width="170" height="90" rx="12" fill="#101E33" stroke="#22304A"/>
    <circle cx="345" cy="358" r="12" fill="url(#accentLand)" opacity="0.85"/>
    <rect x="335" y="382" width="120" height="8" rx="4" fill="#8D96AC"/>
    <rect x="335" y="398" width="90" height="8" rx="4" fill="#5C6478"/>

    <rect x="510" y="330" width="170" height="90" rx="12" fill="#101E33" stroke="#22304A"/>
    <circle cx="540" cy="358" r="12" fill="url(#accentLand)" opacity="0.85"/>
    <rect x="530" y="382" width="120" height="8" rx="4" fill="#8D96AC"/>
    <rect x="530" y="398" width="90" height="8" rx="4" fill="#5C6478"/>
  </g>
</svg>
