<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A2B"/>
      <stop offset="100%" stop-color="#0E1220"/>
    </linearGradient>
    <linearGradient id="accentBiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#4C8DFF"/>
    </linearGradient>
    <linearGradient id="barBiz" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBiz)"/>

  <!-- top browser bar -->
  <rect x="0" y="0" width="800" height="42" fill="#1A2233"/>
  <circle cx="24" cy="21" r="6" fill="#FF5C5C" opacity="0.7"/>
  <circle cx="46" cy="21" r="6" fill="#FFC24C" opacity="0.7"/>
  <circle cx="68" cy="21" r="6" fill="#3FD69A" opacity="0.7"/>
  <rect x="110" y="12" width="300" height="18" rx="9" fill="#0E1220"/>

  <!-- side nav -->
  <rect x="0" y="42" width="150" height="408" fill="#12172A"/>
  <circle cx="40" cy="80" r="14" fill="url(#accentBiz)"/>
  <rect x="64" y="73" width="60" height="14" rx="4" fill="#3A425C"/>
  <g fill="#2A3348">
    <rect x="24" y="130" width="102" height="10" rx="4"/>
    <rect x="24" y="160" width="80" height="10" rx="4"/>
    <rect x="24" y="190" width="90" height="10" rx="4"/>
    <rect x="24" y="220" width="70" height="10" rx="4"/>
  </g>
  <rect x="20" y="120" width="110" height="26" rx="7" fill="url(#accentBiz)" opacity="0.18"/>

  <!-- hero content -->
  <rect x="180" y="72" width="360" height="22" rx="6" fill="#E9ECF4" opacity="0.9"/>
  <rect x="180" y="104" width="260" height="12" rx="5" fill="#8D96AC"/>
  <rect x="180" y="124" width="220" height="12" rx="5" fill="#8D96AC" opacity="0.7"/>
  <rect x="180" y="152" width="130" height="34" rx="8" fill="url(#accentBiz)"/>
  <rect x="322" y="152" width="110" height="34" rx="8" fill="none" stroke="#3A425C" stroke-width="2"/>

  <!-- hero visual card -->
  <rect x="560" y="66" width="200" height="130" rx="14" fill="#171E33" stroke="#2A3348"/>
  <circle cx="660" cy="112" r="26" fill="url(#accentBiz)" opacity="0.8"/>
  <rect x="590" y="150" width="140" height="8" rx="4" fill="#3A425C"/>
  <rect x="590" y="166" width="100" height="8" rx="4" fill="#3A425C"/>

  <!-- stats row -->
  <g>
    <rect x="180" y="230" width="170" height="90" rx="12" fill="#171E33" stroke="#242C42"/>
    <rect x="200" y="250" width="60" height="10" rx="4" fill="#8D96AC"/>
    <rect x="200" y="270" width="90" height="16" rx="5" fill="url(#accentBiz)"/>
    <rect x="370" y="230" width="170" height="90" rx="12" fill="#171E33" stroke="#242C42"/>
    <rect x="390" y="250" width="60" height="10" rx="4" fill="#8D96AC"/>
    <rect x="390" y="270" width="90" height="16" rx="5" fill="#35D6D6" opacity="0.85"/>
    <rect x="560" y="230" width="200" height="90" rx="12" fill="#171E33" stroke="#242C42"/>
    <rect x="580" y="250" width="70" height="10" rx="4" fill="#8D96AC"/>
    <g>
      <rect x="580" y="278" width="14" height="26" fill="url(#barBiz)"/>
      <rect x="602" y="266" width="14" height="38" fill="url(#barBiz)"/>
      <rect x="624" y="286" width="14" height="18" fill="url(#barBiz)"/>
      <rect x="646" y="256" width="14" height="48" fill="url(#barBiz)"/>
      <rect x="668" y="272" width="14" height="32" fill="url(#barBiz)"/>
    </g>
  </g>

  <!-- footer cards -->
  <rect x="180" y="344" width="580" height="80" rx="12" fill="#171E33" stroke="#242C42"/>
  <rect x="204" y="366" width="220" height="12" rx="5" fill="#8D96AC"/>
  <rect x="204" y="386" width="160" height="10" rx="4" fill="#5C6478"/>
  <rect x="600" y="372" width="120" height="30" rx="8" fill="url(#accentBiz)" opacity="0.9"/>
</svg>
