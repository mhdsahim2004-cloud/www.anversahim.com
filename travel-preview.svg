<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyTrav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123B47"/>
      <stop offset="55%" stop-color="#0F2E3D"/>
      <stop offset="100%" stop-color="#0A1E2B"/>
    </linearGradient>
    <linearGradient id="sunTrav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35D6D6"/>
      <stop offset="100%" stop-color="#3FD69A"/>
    </linearGradient>
    <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4653"/>
      <stop offset="100%" stop-color="#123846"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2E3B"/>
      <stop offset="100%" stop-color="#0A2029"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#skyTrav)"/>

  <!-- top browser bar -->
  <rect x="0" y="0" width="800" height="42" fill="#0E2530"/>
  <circle cx="24" cy="21" r="6" fill="#FF5C5C" opacity="0.7"/>
  <circle cx="46" cy="21" r="6" fill="#FFC24C" opacity="0.7"/>
  <circle cx="68" cy="21" r="6" fill="#3FD69A" opacity="0.7"/>
  <rect x="300" y="12" width="200" height="18" rx="9" fill="#0A1E2B"/>

  <!-- sun -->
  <circle cx="640" cy="140" r="46" fill="url(#sunTrav)" opacity="0.85"/>

  <!-- mountains -->
  <polygon points="0,300 140,190 260,300" fill="url(#mtnFar)"/>
  <polygon points="180,300 340,160 500,300" fill="url(#mtnFar)"/>
  <polygon points="420,300 560,200 720,300" fill="url(#mtnFar)"/>
  <polygon points="-50,320 120,230 300,320" fill="url(#mtnNear)"/>
  <polygon points="260,320 460,210 700,320" fill="url(#mtnNear)"/>
  <polygon points="560,320 700,250 850,320" fill="url(#mtnNear)"/>

  <!-- water -->
  <rect x="0" y="320" width="800" height="130" fill="#0A2029"/>
  <g stroke="#1B4653" stroke-width="3" opacity="0.6">
    <line x1="40" y1="345" x2="160" y2="345"/>
    <line x1="220" y1="365" x2="380" y2="365"/>
    <line x1="440" y1="345" x2="600" y2="345"/>
    <line x1="640" y1="380" x2="760" y2="380"/>
  </g>

  <!-- palm silhouette -->
  <g fill="#0A1E2B">
    <rect x="94" y="230" width="10" height="90" rx="3"/>
    <path d="M99 230 C 60 210, 40 220, 30 200 C 55 205, 80 210, 99 230 Z"/>
    <path d="M99 230 C 140 205, 165 215, 175 195 C 148 200, 122 208, 99 230 Z"/>
    <path d="M99 230 C 70 195, 55 175, 65 155 C 82 175, 92 200, 99 230 Z"/>
    <path d="M99 230 C 120 190, 140 175, 135 155 C 115 175, 104 200, 99 230 Z"/>
  </g>

  <!-- UI overlay: search / booking card -->
  <rect x="130" y="180" width="360" height="20" rx="6" fill="#E9ECF4" opacity="0.92"/>
  <rect x="130" y="212" width="260" height="12" rx="5" fill="#CFE9EA" opacity="0.75"/>

  <rect x="130" y="248" width="540" height="86" rx="14" fill="#0E2530" stroke="#1B4653" opacity="0.95"/>
  <rect x="152" y="266" width="90" height="10" rx="4" fill="#7FD9D9"/>
  <rect x="152" y="284" width="70" height="10" rx="4" fill="#5C6478"/>
  <rect x="270" y="266" width="90" height="10" rx="4" fill="#7FD9D9"/>
  <rect x="270" y="284" width="70" height="10" rx="4" fill="#5C6478"/>
  <rect x="388" y="266" width="90" height="10" rx="4" fill="#7FD9D9"/>
  <rect x="388" y="284" width="70" height="10" rx="4" fill="#5C6478"/>
  <rect x="560" y="264" width="110" height="46" rx="10" fill="url(#sunTrav)"/>

  <!-- destination cards -->
  <rect x="130" y="360" width="170" height="70" rx="10" fill="#0E2530" stroke="#1B4653"/>
  <rect x="330" y="360" width="170" height="70" rx="10" fill="#0E2530" stroke="#1B4653"/>
  <rect x="530" y="360" width="140" height="70" rx="10" fill="#0E2530" stroke="#1B4653"/>
</svg>
